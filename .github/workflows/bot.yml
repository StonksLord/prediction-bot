name: Prediction bot

on:
  schedule:
    - cron: "*/15 10-21 * * *"  # every 15 minutes, 10:00 to 21:45 UTC, which covers every Premier League kickoff
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write  # needed to save predictions_log.csv back to the repo

concurrency:
  group: prediction-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Predict and post
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TIMEZONE: Australia/Sydney  # kickoff times are also shown in this timezone
        run: python -m bot.run
      - name: Save the prediction logs
        run: |
          git config user.name "prediction-bot"
          git config user.email "prediction-bot@users.noreply.github.com"
          git add predictions_log.csv || true
          git add markets_log.csv || true
          git diff --cached --quiet || (git commit -m "Log predictions" && git push)
