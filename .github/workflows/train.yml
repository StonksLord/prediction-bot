name: Retrain model

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC; picks up a newly finished season automatically
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.train
      - name: Save the model
        run: |
          git config user.name "prediction-bot"
          git config user.email "prediction-bot@users.noreply.github.com"
          git add model/
          git diff --cached --quiet || (git commit -m "Retrain model" && git push)
